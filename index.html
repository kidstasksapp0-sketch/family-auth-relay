<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول — نجوم الأسرة</title>
<style>
  body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: #FBF7EF; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { max-width: 380px; width: 90%; background: white; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .spinner { width: 36px; height: 36px; border: 4px solid #E2E8F0; border-top-color: #3E9C86; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; color: #1E293B; margin: 0 0 8px; }
  p { font-size: 13px; color: #64748B; line-height: 1.8; margin: 0 0 20px; }
  .btn { display: inline-block; background: #3E9C86; color: white; font-weight: 800; font-size: 14px; padding: 14px 28px; border-radius: 16px; text-decoration: none; border: none; cursor: pointer; }
  .err { background: #FDECEB; color: #B5423A; border-radius: 14px; padding: 14px; font-size: 12px; line-height: 1.8; margin-bottom: 16px; }
  .hidden { display: none; }
  #gisButtonContainer { display: flex; justify-content: center; margin-top: 4px; min-height: 44px; }
</style>
</head>
<body>
<div class="box">
  <div id="loadingState">
    <div class="spinner"></div>
    <h1>جارِ تجهيز تسجيل الدخول...</h1>
    <p>الرجاء الانتظار قليلاً</p>
  </div>
  <div id="errorState" class="hidden">
    <div class="err" id="errMsg"></div>
    <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
  </div>
  <div id="readyState" class="hidden">
    <h1>سجّل دخولك للمتابعة</h1>
    <p>سيُطلب منك اختيار حساب Google الخاص بك دائمًا لضمان الأمان.</p>
    <div id="gisButtonContainer"></div>
  </div>
  <div id="successState" class="hidden">
    <div class="spinner"></div>
    <h1>تم تسجيل الدخول بنجاح ✓</h1>
    <p>اضغط الزر أدناه للعودة إلى التطبيق (بعض الأجهزة تحتاج ضغطة يدوية لأسباب أمنية في المتصفح)</p>
    <button class="btn" id="returnBtn">المتابعة إلى التطبيق</button>
  </div>
</div>

<!-- ====================================================================================
     إصلاح جوهري (v1.6.9 → إعادة تصميم كاملة): استبدال Firebase signInWithPopup/Redirect
     بمكتبة Google Identity Services (GIS) الرسمية — accounts.google.com/gsi/client
     ------------------------------------------------------------------------------------
     التشخيص الفعلي بعد اختبار حقيقي على جهاز أندرويد: الإصلاح السابق (تسجيل خروج استباقي
     قبل signInWithPopup) لم يحل المشكلة حتى في أول فتح للصفحة على متصفح جديد تمامًا (لا
     يمكن أن تكون هناك "جلسة سابقة" فعلية) — ما يُبطل فرضية "الجلسة القديمة" ويؤكد أن
     السبب أعمق: توثيق Firebase نفسه يحذّر صراحة أن signInWithPopup غير موثوق على متصفحات
     الجوال (خصوصًا Android Chrome)، لأن نافذة الـ popup هناك تُفتح كتبويب منفصل تمامًا بلا
     قناة postMessage/window.opener موثوقة بينها وبين الصفحة الأصلية، فتُغلق النافذة بعد
     تأكيد الحساب دون أن تصل بيانات الاعتماد (Credential) للصفحة الأصلية أبدًا — بينما
     signInWithRedirect (الذي كان الحل السابق قبل 1.6.8) يفشل لسبب مختلف تمامًا: تقسيم
     التخزين (Storage Partitioning) بين نطاق هذه الصفحة (GitHub Pages) ونطاق Firebase
     الوسيط (authDomain) عند إعادة تحميل الصفحة بعد العودة من Google.
     كلا المسارين (Popup و Redirect) في Firebase JS SDK يمران عبر نفس آلية OAuth الداخلية
     المعطوبة في هذا السياق. الحل الجذري: تجاوز Firebase Auth بالكامل لخطوة "الحصول على
     هوية Google" واستخدام مكتبة Google Identity Services الرسمية مباشرة — وهي الطريقة التي
     توصي بها Google نفسها حاليًا لكل تكاملات "Sign in with Google" الجديدة (خلَفت مكتبة
     gapi/auth2 القديمة التي يعتمد عليها Firebase داخليًا). الزر المعروض هنا هو زر Google
     الرسمي (google.accounts.id.renderButton) — وهذا مضمون من جوجل نفسها للعمل بشكل موثوق
     على كل المتصفحات (سطح مكتب وجوال) دون أي اعتماد على popup/redirect مُدارة من Firebase.
     النتيجة: JWT ID Token موقّع من جوجل مباشرة (response.credential) — مضمون الوجود دائمًا
     عند نجاح العملية (لا يوجد سيناريو "نجاح بلا رمز" كما كان يحدث مع Firebase)، يُمرَّر عبر
     رابط العودة (Deep Link) للتطبيق، الذي يبنى منه GoogleAuthProvider.credential(idToken)
     ويكمل تسجيل الدخول الفعلي في Firebase الخاص بهذه العائلة كما كان تمامًا من قبل.
     ⚠️ يتطلب هذا التصميم قيمة إضافية واحدة (Web Client ID) تُضاف عند إعداد كل عائلة، تُقرأ
     من نفس شاشة تفعيل "Google" في Firebase Console (بدون أي خطوة خارج Firebase إطلاقًا).
     ==================================================================================== -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  function log(msg, extra) {
    try { console.log("[auth-relay] " + msg, extra !== undefined ? extra : ""); } catch (e) {}
  }

  function showError(msg) {
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("errorState").classList.remove("hidden");
    document.getElementById("errMsg").textContent = msg;
  }
  function showLoading() {
    document.getElementById("errorState").classList.add("hidden");
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("loadingState").classList.remove("hidden");
  }
  function showReady() {
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("errorState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("readyState").classList.remove("hidden");
  }

  function getParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function buildReturnUrl(scheme, host, extraParams) {
    var url = scheme + "://" + host;
    var qs = Object.keys(extraParams).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(extraParams[k]);
    }).join("&");
    return url + (qs ? "?" + qs : "");
  }

  // فك تشفير حمولة JWT محليًا (بدون أي مكتبة) — للعرض فقط (البريد الإلكتروني)؛ التحقق
  // الفعلي من صحة التوقيع يتم لاحقًا من طرف Firebase نفسه عند استدعاء signInWithCredential
  // في التطبيق الرئيسي، فلا حاجة ولا فائدة أمنية من التحقق منه هنا.
  function decodeJwtPayload(token) {
    try {
      var base64Url = token.split(".")[1];
      var base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      var json = decodeURIComponent(atob(base64).split("").map(function (c) {
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(""));
      return JSON.parse(json);
    } catch (e) { return null; }
  }

  log("page-load-start");

  var scheme = getParam("scheme");
  var host = getParam("host") || "auth-callback";
  var clientId = getParam("cid");

  if (!scheme || !clientId) {
    showError("رابط غير صالح أو ناقص — تأكد من إضافة \"Web Client ID\" الخاص بهذه العائلة في إعدادات التطبيق، ثم أعد المحاولة من داخل تطبيق نجوم الأسرة.");
    return;
  }

  var returnUrl = null;

  // ---- نجاح تسجيل الدخول: يستدعيها GIS مباشرة مع JWT ID Token موقّع من جوجل ----
  // على عكس Firebase signInWithPopup/Redirect، لا يوجد هنا أي سيناريو "نجاح بلا رمز":
  // GIS إما يستدعي هذه الدالة مع response.credential صالح، أو لا يستدعيها إطلاقًا.
  function handleGisCredential(response) {
    var idToken = response && response.credential;
    if (!idToken) {
      log("gis-credential-missing");
      showError("لم يصل رمز الدخول من جوجل — حاول مجددًا.");
      return;
    }
    var payload = decodeJwtPayload(idToken);
    log("gis-credential-received", { email: payload && payload.email });
    returnUrl = buildReturnUrl(scheme, host, { idToken: idToken });
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("successState").classList.remove("hidden");
    // محاولة تلقائية للعودة فور النجاح، مع إبقاء الزر اليدوي كبديل مضمون
    setTimeout(function () { window.location.href = returnUrl; }, 400);
  }

  var gisWaitStart = Date.now();
  function initGis() {
    if (!window.google || !window.google.accounts || !window.google.accounts.id) {
      // مكتبة GIS تُحمَّل عبر CDN خارجي؛ ننتظر تحميلها حتى 6 ثوانٍ قبل اعتبار الأمر فشلاً
      // (قد يكون بطء الشبكة، أو حجب المكتبة من مانع إعلانات صارم على الجهاز)
      if (Date.now() - gisWaitStart > 6000) {
        log("gis-load-timeout");
        showError("تعذّر تحميل مكتبة تسجيل الدخول من جوجل — تحقق من اتصال الإنترنت (وتعطيل أي مانع إعلانات إن وُجد) ثم أعد المحاولة.");
        return;
      }
      setTimeout(initGis, 150);
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGisCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
        // itp_support: تحسين توافق مع متصفحات تفرض حماية تتبع صارمة (مثل Safari)
        itp_support: true
      });
      // ملاحظة أمنية: نستخدم renderButton فقط (زر واضح يضغطه المستخدم بوعي) ولا نستخدم
      // google.accounts.id.prompt() (One Tap)، لتفادي أي اختيار صامت تلقائي لحساب محفوظ
      // مسبقًا على الجهاز (مثل حساب أحد الوالدين) دون تدخل واعٍ من المستخدم الحالي — بنفس
      // مبدأ prompt:"select_account" الذي كان مطبّقًا سابقًا مع Firebase.
      var container = document.getElementById("gisButtonContainer");
      google.accounts.id.renderButton(container, {
        type: "standard", theme: "filled_blue", size: "large",
        text: "signin_with", shape: "pill", logo_alignment: "center", width: 280,
      });
      log("gis-initialized");
      showReady();
    } catch (e) {
      log("gis-init-error", e && e.message);
      showError("تعذّر تجهيز تسجيل الدخول من جوجل: " + ((e && e.message) || String(e)) + " — تأكد من صحة Web Client ID المُدخل في إعدادات التطبيق.");
    }
  }

  document.getElementById("returnBtn").addEventListener("click", function () {
    if (returnUrl) window.location.href = returnUrl;
  });

  showLoading();
  initGis();
})();
</script>
</body>
</html>
