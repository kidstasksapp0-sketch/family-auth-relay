<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول — نجوم الأسرة</title>
<style>
  body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: #FBF7EF; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { max-width: 380px; width: 90%; background: white; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .spinner { width: 36px; height: 36px; border: 4px solid #E2E8F0; border-top-color: #3E9C86; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; color: #1E293B; margin: 0 0 8px; }
  p { font-size: 13px; color: #64748B; line-height: 1.8; margin: 0 0 20px; }
  .btn { display: inline-block; background: #3E9C86; color: white; font-weight: 800; font-size: 14px; padding: 14px 28px; border-radius: 16px; text-decoration: none; border: none; cursor: pointer; }
  .err { background: #FDECEB; color: #B5423A; border-radius: 14px; padding: 14px; font-size: 12px; line-height: 1.8; margin-bottom: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <div id="loadingState">
    <div class="spinner"></div>
    <h1>جارِ تجهيز تسجيل الدخول...</h1>
    <p>الرجاء الانتظار قليلاً</p>
  </div>
  <div id="errorState" class="hidden">
    <div class="err" id="errMsg"></div>
    <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
  </div>
  <div id="readyState" class="hidden">
    <h1>سجّل دخولك للمتابعة</h1>
    <p>سيُطلب منك اختيار حساب Google الخاص بك دائمًا لضمان الأمان.</p>
    <button class="btn" id="signInBtn">الدخول بحساب Google</button>
  </div>
  <div id="successState" class="hidden">
    <div class="spinner"></div>
    <h1>تم تسجيل الدخول بنجاح ✓</h1>
    <p>اضغط الزر أدناه للعودة إلى التطبيق (بعض الأجهزة تحتاج ضغطة يدوية لأسباب أمنية في المتصفح)</p>
    <button class="btn" id="returnBtn">المتابعة إلى التطبيق</button>
  </div>
</div>

<!-- Firebase compat SDKs — نفس الإصدار المستخدم داخل التطبيق نفسه لضمان التوافق -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  function log(msg, extra) {
    try { console.log("[auth-relay] " + msg, extra !== undefined ? extra : ""); } catch (e) {}
  }

  function showError(msg) {
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("errorState").classList.remove("hidden");
    document.getElementById("errMsg").textContent = msg;
  }
  function showLoading() {
    document.getElementById("errorState").classList.add("hidden");
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("loadingState").classList.remove("hidden");
  }
  function showReady() {
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("errorState").classList.add("hidden");
    document.getElementById("successState").classList.add("hidden");
    document.getElementById("readyState").classList.remove("hidden");
  }

  function getParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function buildReturnUrl(scheme, host, extraParams) {
    var url = scheme + "://" + host;
    var qs = Object.keys(extraParams).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(extraParams[k]);
    }).join("&");
    return url + (qs ? "?" + qs : "");
  }

  log("page-load-start");

  // مفتاح تخزين مؤقت (sessionStorage) لحفظ query parameters الحالية — يُستخدم فقط إن سقطنا
  // لمسار signInWithRedirect الاحتياطي (نادر: فقط عند حظر النافذة المنبثقة)، لأن ذلك المسار
  // يُعيد تحميل الصفحة بالكامل بعد العودة من Google وقد لا تبقى هذه القيم في الـ URL.
  var SESSION_KEY = "ktapp_auth_relay_params_v1";

  var scheme = getParam("scheme");
  var host = getParam("host") || "auth-callback";
  var cfgB64 = getParam("cfg");

  if (!scheme || !cfgB64) {
    try {
      var savedRaw = sessionStorage.getItem(SESSION_KEY);
      if (savedRaw) {
        var saved = JSON.parse(savedRaw);
        scheme = scheme || saved.scheme;
        host = getParam("host") || saved.host || host;
        cfgB64 = cfgB64 || saved.cfg;
        log("restored-params-from-sessionStorage");
      }
    } catch (e) {}
  }

  if (!scheme || !cfgB64) {
    showError("رابط غير صالح — يجب فتح هذه الصفحة من داخل تطبيق نجوم الأسرة فقط.");
    return;
  }

  var firebaseConfig;
  try {
    firebaseConfig = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(cfgB64)))));
  } catch (e) {
    showError("تعذّر قراءة إعدادات العائلة من الرابط.");
    return;
  }

  var returnUrl = null;
  try {
    // ---- إصلاح جوهري: استخدام تطبيق Firebase الافتراضي بلا اسم مخصص متغيّر ----
    // الكود السابق كان يستخدم firebase.initializeApp(firebaseConfig, "auth-relay-" + Date.now())
    // وهذا يُنتج اسم تطبيق مختلف في كل تحميل للصفحة. بما أن signInWithRedirect يحفظ حالة
    // "الطلب المعلّق" في IndexedDB بمفتاح يتضمن اسم التطبيق، فإن الصفحة بعد العودة من Google
    // (وهي تحميل كامل جديد للصفحة) كانت تُنشئ اسمًا جديدًا مختلفًا عن الاسم الذي بدأ الطلب،
    // فيفشل getRedirectResult() في العثور على أي نتيجة رغم نجاح الدخول الفعلي في Google.
    // الحل: عدم تمرير اسم مخصص إطلاقًا (استخدام التطبيق الافتراضي "[DEFAULT]")، وهو ثابت
    // دائمًا بين تحميلات الصفحة المختلفة، فيتطابق اسم البداية مع اسم العودة دومًا.
    firebase.initializeApp(firebaseConfig);
  } catch (e) {
    showError("تعذّر الاتصال بإعدادات هذه العائلة: " + (e && e.message ? e.message : String(e)));
    return;
  }

  var app = firebase.apps[firebase.apps.length - 1];
  var auth = app.auth();

  // ---- نجاح تسجيل الدخول: يُستخدم لكل من مسار العودة من Redirect ----
  function handleSignInSuccess(result) {
    var credential = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    var idToken = credential && credential.idToken;
    if (!idToken) { showError("لم يصل رمز الدخول من جوجل — حاول مجددًا."); return; }
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    returnUrl = buildReturnUrl(scheme, host, { idToken: idToken });
    document.getElementById("loadingState").classList.add("hidden");
    document.getElementById("successState").classList.remove("hidden");
    // محاولة تلقائية للعودة فور النجاح، مع إبقاء الزر اليدوي كبديل مضمون
    setTimeout(function () { window.location.href = returnUrl; }, 400);
  }

  // ---- فشل تسجيل الدخول: نفس تصنيف الرسائل المستخدم سابقًا في مسار Popup ----
  function handleSignInError(error) {
    var msg = (error && error.message) || String(error);
    if (error && error.code === "auth/popup-closed-by-user") { msg = "تم إغلاق نافذة اختيار الحساب قبل إكمالها."; }
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    var errReturnUrl = buildReturnUrl(scheme, host, { error: msg });
    showError(msg);
    setTimeout(function () { window.location.href = errReturnUrl; }, 1500);
  }

  function doSignIn() {
    document.getElementById("readyState").classList.add("hidden");
    document.getElementById("loadingState").classList.remove("hidden");

    var provider = new firebase.auth.GoogleAuthProvider();
    // إلزامي أمنيًا: إجبار اختيار الحساب دائمًا — يمنع أي دخول صامت بحساب محفوظ مسبقًا
    // في متصفح الجهاز (مثلاً حساب أحد الوالدين) دون تدخل واعٍ من المستخدم الحالي.
    provider.setCustomParameters({ prompt: "select_account" });

    // نحفظ query parameters الحالية احتياطًا (تُستخدم فقط إن سقطنا لمسار signInWithRedirect
    // الاحتياطي أدناه، والذي يحتاج إعادة تحميل كاملة للصفحة).
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ scheme: scheme, host: host, cfg: cfgB64 }));
    } catch (e) {}

    // ---- إصلاح جوهري (v1.6.8): signInWithPopup بدل signInWithRedirect كمسار أساسي ----
    // v1.6.7 حلّت مشكلة فتح الصفحة داخل WebView/Custom Tab بفتحها في متصفح نظام خارجي حقيقي
    // ومستقل تمامًا. لكن signInWithRedirect يبقى معطوبًا حتى داخل متصفح حقيقي، لأن نجاحه يعتمد
    // على تواصل خفي بين نطاق هذه الصفحة (GitHub Pages) ونطاق Firebase الوسيط (authDomain) عبر
    // iframe/تخزين مشترك بين نطاقين مختلفين — وهذا بالضبط ما تمنعه متصفحات Chrome الحديثة
    // (Storage Partitioning) بغضّ النظر عن نوع المتصفح المُستضيف. النتيجة الملحوظة: يتم تأكيد
    // الحساب فعليًا عند Google، لكن الصفحة تعود لحالة "سجّل دخولك" الأولية دون أي نتيجة لأن
    // getRedirectResult() يرجع فارغًا، فلا يحدث أي عودة (Deep Link) للتطبيق إطلاقًا.
    // الحل: signInWithPopup يتواصل بين نافذتين داخل *نفس* جلسة المتصفح عبر postMessage —
    // آلية مصممة أصلًا للعمل بين نطاقين مختلفين ولا تتأثر بعزل التخزين إطلاقًا، ولا تحتاج أي
    // إعادة تحميل كاملة لهذه الصفحة. الآن بما أننا داخل متصفح نظام حقيقي مستقل (وليس WebView)
    // فالنوافذ المنبثقة تعمل بلا قيود، ولا يوجد أي سبب متبقٍ لتفضيل الـ redirect.
    log("sign-in-popup-start");
    auth.signInWithPopup(provider).then(function (result) {
      log("sign-in-popup-success");
      handleSignInSuccess(result);
    }).catch(function (error) {
      var code = error && error.code;
      log("sign-in-popup-error", code || (error && error.message));
      // fallback احتياطي فقط: إن مُنعت النافذة المنبثقة تحديدًا (نادر داخل متصفح حقيقي)
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/cancelled-popup-request") {
        log("sign-in-popup-blocked-fallback-redirect");
        auth.signInWithRedirect(provider).catch(function (redirectError) {
          log("sign-in-redirect-immediate-error", redirectError && redirectError.message);
          handleSignInError(redirectError);
        });
        return;
      }
      handleSignInError(error);
    });
  }

  document.getElementById("signInBtn").addEventListener("click", doSignIn);
  document.getElementById("returnBtn").addEventListener("click", function () {
    if (returnUrl) window.location.href = returnUrl;
  });

  // ---- التحقق من نتيجة عودة من إعادة توجيه Google قبل عرض أي حالة نهائية ----
  // نعرض loadingState أثناء الانتظار (سواء كان هذا أول تحميل عادي أو عودة فعلية من Google)
  // لتفادي وميض الواجهة (flash) بين الحالتين قبل معرفة أيّهما فعليًا.
  showLoading();
  auth.getRedirectResult().then(function (result) {
    log("redirect-result-received", { hasUser: !!(result && result.user) });
    if (result && result.user) {
      handleSignInSuccess(result);
    } else {
      // لا توجد نتيجة عودة — هذا أول تحميل عادي للصفحة، نعرض زر الدخول كالمعتاد
      log("redirect-result-empty-showing-ready");
      showReady();
    }
  }).catch(function (error) {
    log("redirect-result-error", error && error.message);
    handleSignInError(error);
  });
})();
</script>
</body>
</html>
